[project]
name = "latest-plus-v3-bs"
version = "3.0.2"
description = "Compact browser control for SC520CS FPGA video over USB-UART"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4", "pyserial>=3.5,<4", "Pillow>=11,<13", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "imageio-ffmpeg>=0.6,<1", "waitress>=3,<4"]

[tool.setuptools]
py-modules = ["app", "board_link", "protocol", "compatibility", "media_store", "face_events", "recording", "server_info", "sort_link", "run"]
